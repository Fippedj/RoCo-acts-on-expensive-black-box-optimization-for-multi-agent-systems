[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roco-ebbo"
version = "0.1.0"
description = "RoCo reproduction and expensive black-box optimization migration"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy<2",
  "scipy",
  "pandas",
  "scikit-learn",
  "networkx",
  "pydantic>=2.7,<3",
  "hydra-core",
  "jinja2",
  "psutil",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "tiktoken"]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]
ebbo = ["torch", "gpytorch", "botorch"]

[project.scripts]
roco-ebbo = "roco_ebbo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
