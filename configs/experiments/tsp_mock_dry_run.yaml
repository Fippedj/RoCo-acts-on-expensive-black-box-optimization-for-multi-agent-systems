# Stage 5 P6 protocol check. This is an offline Mock/fake dry-run, not a paper result.
protocol:
  schema_version: roco-tsp-experiment-config-v1
  dry_run: true

llm:
  # The loader rejects every non-Mock provider. No HTTP transport is constructed.
  provider: mock
  temperatures:
    explorer: 1.3
    exploiter: 0.8
    critic: 1.0
    integrator: 1.0

dataset:
  # Engineering P6 inventory: one instance per split/size keeps protocol testing cheap.
  # It is not the paper's training/test corpus or instance-count claim.
  master_seed: 9701
  sizes: [50, 100, 200]
  splits:
    train: 1
    test: 1
  generator_rule: python-random-mt19937-uniform-unit-square-v1

experiment:
  # Fixed three-seed dry-run required by the protocol. These are engineering seeds.
  seeds: [101, 202, 303]
  methods: [eoh, roco]
  # Prompt information conditions, not expensive-oracle conditions. The Mock records
  # both conditions but deliberately does not assert a quality difference.
  prompt_visibility: [white_box, black_box]
  budgets:
    # Every method and every condition receives these identical hard ceilings.
    max_llm_calls: 24
    max_tokens: 120000
    max_generated_candidates: 24
    max_valid_evals: 24
    max_cost: 1.0
    max_wall_time: 120.0
    cost_currency: USD

evolution:
  # Deliberately small engineering dry-run values; not paper multiplicities.
  population_size: 4
  generations: 1
  candidates_per_operator: 1
  collaboration_rounds: 2
  elite_sampling_power: 3.0

benchmark:
  name: tsp
  # Per-candidate engineering safety timeout, not a paper training timeout.
  evaluator_timeout_seconds: 5.0

memory:
  # Set enabled=true and include memory_roco in methods only for an explicit
  # separate control-flow condition. The default leaves Stage 4 smoke untouched.
  enabled: false
  recent_events: 5
  success_slots: 3
  failure_slots: 2
  elite_count: 1
  max_context_characters: 16000
