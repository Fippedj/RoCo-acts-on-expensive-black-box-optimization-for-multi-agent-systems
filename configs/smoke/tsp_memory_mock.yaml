# Two-generation deterministic Stage 4 memory control-flow smoke; not a paper result.
run:
  seed: 7
  objective: minimize
  budgets:
    max_valid_evals: 60
    max_llm_calls: 60
    max_tokens: 200000

llm:
  provider: mock
  temperatures:
    explorer: 1.3
    exploiter: 0.8
    critic: 1.0
    integrator: 1.0

evolution:
  mode: roco
  population_size: 4
  generations: 2
  candidates_per_operator: 1
  collaboration_rounds: 2
  elite_sampling_power: 3.0

memory:
  enabled: true
  recent_events: 5
  success_slots: 3
  failure_slots: 2
  elite_count: 1
  max_context_characters: 16000

benchmark:
  name: tsp
  nodes: 20
  instances: 1
  evaluator_timeout_seconds: 5
