# Paper-aligned settings. Items marked "engineering" are not fully disclosed in RoCo.
run:
  # Engineering default: the paper does not disclose its random seed.
  seed: 2025
  objective: minimize
  budgets:
    # Appendix D is summarized as a maximum of 400 evaluations; its scope
    # still needs PDF-level verification and is distinct from LLM calls.
    max_valid_evals: 400
    # Main text reports 400 LLM calls per generation. Keep this separate from
    # evaluations and set an explicit hard limit in each reproduction study.
    max_llm_calls: null
    max_tokens: null

llm:
  model: gpt-4o-mini
  temperatures:
    explorer: 1.3
    exploiter: 0.8
    critic: 1.0
    integrator: 1.0

evolution:
  # Stage 3 collaboration path. This preset is documentary, not a real-provider entry point.
  mode: roco
  population_size: 10
  collaboration_rounds: 3
  elite_sampling_power: 3.0

memory:
  # Engineering V1: the paper does not disclose memory storage/retrieval.
  backend: jsonl
  recent_events: 5

evaluation:
  # Engineering placeholders pending PDF-level verification of both the
  # numeric values and whether timeout applies per instance/candidate/batch.
  train_timeout_seconds: 60
  cvrp_train_timeout_seconds: 120
